name: Build & Publish Tone APK Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'
      release_title:
        description: 'Release title'
        required: false
        default: 'Tone Music Player Update'

permissions:
  contents: write

jobs:
  release-apk:
    name: Build Slim arm64 APK & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Determine version number
        id: version
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          echo "tag=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT

      - name: Build Universal & Slim APKs
        run: |
          # 1. Build Universal APK (compatible with all 32-bit and 64-bit Android devices)
          flutter build apk --release --build-name="${{ steps.version.outputs.version }}" --build-number="${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "Tone-${{ steps.version.outputs.tag }}-universal.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "app-release.apk"

          # 2. Build slim arm64-v8a APK (optimized for 64-bit devices)
          flutter build apk --release --target-platform android-arm64 --build-name="${{ steps.version.outputs.version }}" --build-number="${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "Tone-${{ steps.version.outputs.tag }}-arm64-v8a.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ github.event.inputs.release_title || format('Melo {0}', steps.version.outputs.tag) }}
          generate_release_notes: true
          files: |
            Tone-${{ steps.version.outputs.tag }}-universal.apk
            app-release.apk
            Tone-${{ steps.version.outputs.tag }}-arm64-v8a.apk
